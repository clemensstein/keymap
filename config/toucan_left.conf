CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Enter deep sleep https://zmk.dev/docs/features/low-power-states
CONFIG_ZMK_SLEEP=y

# Defaults to 15 minutes but 60 minutes is only very slightly more power draw and user experience is much better to not
# have keyboard go to deep sleep (i.e. having to reconenect to bluetooth)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# This is for 'regular' ZMK idle behavior.  Default is 30000 (30 seconds)
# This helps A LOT with touchpad power consumption (only 1.7mA idle vs 2.9mA active).  The only user visible aspect is
# that the touchpad needs 300ms to start seeing touches when next pressed - but this behavior is suppressed if we
# have pressed a keyboard key within the last 30 seconds (highly likely).
CONFIG_ZMK_IDLE_TIMEOUT=30000

# Display-Stil:
# 0 = Text, 1 = Toucan-Logo, 2 = Boegen + WPM-Kurve, 3 = HUD
CONFIG_TOUCAN_STATUS_SCREEN=3

CONFIG_INPUT_THREAD_STACK_SIZE=2048

# --- Eigene Bluetooth-Anpassungen (wie bei der Piantor Pro BT) ---
# 2M-Funkmodus nur zur rechten Haelfte, zum PC bleibt es 1M
# (Intel/Realtek BT-Chip Fix fuer Windows). Gesteuert in
# boards/shields/toucan/toucan_phy.c.
CONFIG_BT_CTLR_PHY_2M=y

# BT-Sendeleistung erhöhen
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Windows-spezifische Fixes (nur die linke Hälfte koppelt mit dem Computer)
CONFIG_ZMK_BLE_PASSKEY_ENTRY=y
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# Verbindung zum PC: kuerzestes BLE-Intervall (7,5 ms = 6 x 1,25 ms) anfragen.
# Ohne diese Zeilen erlaubt ZMK bis 15 ms, und Windows nimmt oft das langsamere
# Intervall -> Trackpad wirkt ruckelig. Windows entscheidet, ob es zustimmt.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6

# Trackpad-Daten kommen von der rechten Haelfte (je Bewegung 2 Pakete: X und Y).
# Mit 1 Empfangspuffer (Standard) passt nur 1 Paket pro Funkintervall durch,
# bei laengeren Bewegungen staut es sich -> kurzes Haken. Mehr Puffer:
CONFIG_BT_CTLR_RX_BUFFERS=6
CONFIG_BT_BUF_ACL_RX_COUNT=6
# Sendepuffer fuer die Maus-Reports zum PC
CONFIG_BT_BUF_ACL_TX_COUNT=10
